name: CI

on:
  push:
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libclang-dev cmake libasound2-dev libdbus-1-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install macOS system dependencies
        if: matrix.os == 'macos-latest'
        run: brew install cmake

      - name: Install Windows system dependencies (LLVM)
        if: matrix.os == 'windows-latest'
        run: choco install llvm -y

      - name: Set LIBCLANG_PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Shorten CARGO_TARGET_DIR (Windows)
        # whisper.cpp's Vulkan shader-gen sub-build nests very deep
        # (target/debug/build/whisper-rs-sys-<hash>/out/build/ggml/.../
        # vulkan-shaders-gen-build/CMakeFiles/CMakeScratch/TryCompile-<hash>/...).
        # Combined with the default checkout path, that exceeds Windows'
        # 260-char MAX_PATH and fails with FileTracker FTK1011
        # ("could not create the new file tracking log file").
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=C:\ct" >> $env:GITHUB_ENV

      - name: Resolve latest Vulkan SDK version (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Invoke-RestMethod -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt").Trim()
          echo "VULKAN_SDK_VERSION=$ver" >> $env:GITHUB_ENV
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH

      - name: Cache Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        id: vulkan-sdk-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: windows-vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK (Windows, for whisper-rs GPU acceleration)
        # The official LunarG installer bundles the shader toolchain (glslc)
        # that whisper.cpp's Vulkan backend needs at build time.
        if: matrix.os == 'windows-latest' && steps.vulkan-sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile "$env:RUNNER_TEMP\vulkan_sdk.exe"
          & "$env:RUNNER_TEMP\vulkan_sdk.exe" --root "$env:VULKAN_SDK" --accept-licenses --default-answer --confirm-command install

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
