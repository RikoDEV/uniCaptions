name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev cmake libasound2-dev libdbus-1-dev libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install macOS system dependencies
        if: matrix.platform == 'macos-latest'
        run: brew install cmake

      - name: Install Windows system dependencies (LLVM)
        if: matrix.platform == 'windows-latest'
        run: choco install llvm -y

      - name: Set LIBCLANG_PATH (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Shorten CARGO_TARGET_DIR (Windows)
        # See the matching step in ci.yml: whisper.cpp's Vulkan shader-gen
        # sub-build hits Windows' 260-char MAX_PATH with this repo's default
        # checkout path otherwise (FileTracker FTK1011).
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=C:\ct" >> $env:GITHUB_ENV

      - name: Resolve latest Vulkan SDK version (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Invoke-RestMethod -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt").Trim()
          echo "VULKAN_SDK_VERSION=$ver" >> $env:GITHUB_ENV
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH

      - name: Cache Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        id: vulkan-sdk-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: windows-vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK (Windows, for whisper-rs GPU acceleration)
        # See the matching step in ci.yml for why this uses the official
        # LunarG installer instead of humbletim/setup-vulkan-sdk.
        if: matrix.platform == 'windows-latest' && steps.vulkan-sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile "$env:RUNNER_TEMP\vulkan_sdk.exe"
          & "$env:RUNNER_TEMP\vulkan_sdk.exe" --root "$env:VULKAN_SDK" --accept-licenses --default-answer --confirm-command install

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # whisper.cpp/ggml uses std::filesystem, which requires macOS 10.15+.
          # Tauri's default deployment target (10.13) is too low and fails the
          # build; macos-latest runners are Apple Silicon (macOS 11+ only) so
          # raising this is safe. Ignored on non-macOS platforms.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          # Attaches build artifacts to a release you already created for this
          # tag, instead of creating a separate one. releaseName/releaseBody
          # are intentionally omitted so the action doesn't overwrite the
          # title/notes you wrote by hand. releaseDraft must match the actual
          # state of that release (false = already published).
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
