[package]
name = "unicaptions"
version = "0.1.0"
description = "Cross-platform live captions and translation overlay"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "unicaptions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
whisper-rs = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "multipart", "json"] }
futures-util = "0.3"
keyring = "3"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ndarray = "0.16"

[target.'cfg(windows)'.dependencies]
wasapi = "0.17"
# GPU-accelerated whisper.cpp inference via Vulkan (works across NVIDIA/AMD/Intel).
# Requires the Vulkan SDK (with glslc/shaderc) installed on the build machine;
# at runtime it falls back to whatever Vulkan-capable device is present, or
# silently no-ops to CPU if no such device/driver is found.
whisper-rs = { version = "0.16", features = ["vulkan"] }
