[package]
name = "unicaptions"
description = "Cross-platform live captions and translation overlay"
version.workspace = true
edition.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "unicaptions"
path = "src/main.rs"

[dependencies]
unicaptions-core = { path = "../core" }
# OpenGL (glow) rather than wgpu: on Windows the wgpu swapchain busy-spins a CPU
# core even for an idle trivial app, and glow also builds faster and smaller.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "x11",
    "glow",
] }
egui_extras = { version = "0.37", features = ["svg", "image"] }
tray-icon = "0.26"
fontdb = "0.24"
auto-launch = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
single-instance = "0.3"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[package.metadata.winresource]
ProductName = "uniCaptions"
FileDescription = "Live captions and translation overlay"

# Installer/bundle configuration for `cargo packager` (https://crates.io/crates/cargo-packager).
# Run from this directory: `cargo packager --release`. Keys are camelCase.
[package.metadata.packager]
productName = "uniCaptions"
identifier = "com.unicaptions.app"
outDir = "../../dist"
category = "Utility"
icons = [
    "../../assets/32x32.png",
    "../../assets/128x128.png",
    "../../assets/128x128@2x.png",
    "../../assets/icon.icns",
    "../../assets/icon.ico",
]
beforePackagingCommand = "cargo build --release -p unicaptions"

[package.metadata.packager.macos]
minimumSystemVersion = "11.0"
infoPlistPath = "Info.plist"

[package.metadata.packager.nsis]
installMode = "currentUser"

# Runtime libraries the Linux binary loads (winit loads xkbcommon-x11 with dlopen,
# so it is NOT picked up automatically; without it the app panics on X11).
[package.metadata.packager.deb]
depends = [
    "libgtk-3-0t64 | libgtk-3-0",
    "libayatana-appindicator3-1",
    "libasound2t64 | libasound2",
    "libxdo3",
    "libxkbcommon-x11-0",
    "libdbus-1-3",
]
