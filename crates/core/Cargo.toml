[package]
name = "unicaptions-core"
description = "uniCaptions engine: audio capture, speech recognition, translation, settings"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
whisper-rs = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "multipart", "json"] }
futures-util = "0.3"
keyring = "3"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ndarray = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
dirs = "7"

[target.'cfg(windows)'.dependencies]
wasapi = "0.17"
# GPU-accelerated whisper.cpp inference via Vulkan (works across NVIDIA/AMD/Intel).
# Requires the Vulkan SDK (with glslc/shaderc) installed on the build machine;
# at runtime it falls back to whatever Vulkan-capable device is present, or
# silently no-ops to CPU if no such device/driver is found.
whisper-rs = { version = "0.16", features = ["vulkan"] }

[dev-dependencies]
tempfile = "3"
