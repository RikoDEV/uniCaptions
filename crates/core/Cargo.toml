[package]
name = "unicaptions-core"
description = "uniCaptions engine: audio capture, speech recognition, translation, settings"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
whisper-rs = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "multipart", "json"] }
futures-util = "0.3"
keyring = "3"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ndarray = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
dirs = "7"

# keyring 3.x has NO default credential store: without one of these features it
# silently falls back to an in-memory mock and API keys would never be persisted.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
wasapi = "0.17"
# GPU-accelerated whisper.cpp inference via Vulkan (works across NVIDIA/AMD/Intel).
# Requires the Vulkan SDK (with glslc/shaderc) installed on the build machine;
# at runtime it falls back to whatever Vulkan-capable device is present, or
# silently no-ops to CPU if no such device/driver is found.
whisper-rs = { version = "0.16", features = ["vulkan"] }

[dev-dependencies]
tempfile = "3"
