[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RikoDEV"]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Unoptimised dependencies make font scanning, image decoding and inference
# painfully slow in debug builds, so optimise them even in dev.
[profile.dev.package."*"]
opt-level = 2
